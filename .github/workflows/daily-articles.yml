name: Daily articles

on:
  schedule:
    - cron: "17 5 * * *"     # every day 05:17 UTC = 10:17 AM Pakistan
  workflow_dispatch:          # lets you press "Run workflow" to test it
    inputs:
      count:
        description: "How many articles (leave empty for default)"
        required: false

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Write new articles
        env:
          API_KEY: ${{ secrets.API_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          API_BASE: ${{ vars.API_BASE }}
          API_MODEL: ${{ vars.API_MODEL }}
          API_STYLE: ${{ vars.API_STYLE }}
          ARTICLES_PER_DAY: ${{ github.event.inputs.count || vars.ARTICLES_PER_DAY }}
          TOKEN_BUDGET: ${{ vars.TOKEN_BUDGET }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS }}
        run: python generate_articles.py

      - name: Build every page
        if: ${{ !cancelled() }}   # still rebuilds the site if article writing failed
        run: python build.py

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "bhc-bot"
          git config user.email "bhc-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily update $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
