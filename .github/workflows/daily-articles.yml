name: Generate Daily Articles
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-generativeai

      - name: Generate articles
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
        run: python generate_articles.py

      - name: Fix all pages
        run: python fix_index.py

      - name: Generate sitemap
        run: python generate_sitemap.py

      - name: Commit and push
        run: |
          git config user.name "HealthGuide Bot"
          git config user.email "bot@healthguide.com"
          git add .
          git diff --cached --quiet || git commit -m "Daily update $(date +%Y-%m-%d)"
          git push
