name: Test API connection

on:
  workflow_dispatch:      # only runs when you press the button; costs about 60 tokens

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Try each key
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_2: ${{ secrets.API_KEY_2 }}
          API_BASE: ${{ vars.API_BASE }}
          API_MODEL: ${{ vars.API_MODEL }}
        run: python tools/test_api.py
