name: Weekly site check

on:
  schedule:
    - cron: "43 2 * * 0"     # Sundays 02:43 UTC = 7:43 AM Pakistan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links, articles and write the report
        run: python tools/check_site.py
