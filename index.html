<style>
/* ================================================
   HEALTHGUIDE, Global Stylesheet
   Font: Plus Jakarta Sans (linked in HTML)
   ================================================ */

/* ── Reset ───────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#edf4fb;color:#1a232e;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
button{cursor:pointer;border:none;background:none;font-family:inherit}
ul,ol{list-style:none}
input,select,textarea{font-family:inherit}

/* ── Variables ───────────────────── */
:root{
  --p:#1a8fd1;--ph:#1578b0;--pl:#e3f4fd;
  --g:#4caf50;--gh:#388e3c;--gl:#e8f5e9;--gt:#2e7d32;
  --pu:#7c3aed;--pul:#f0eaff;
  --or:#f97316;--orl:#fff4e6;
  --bg:#edf4fb;--w:#fff;
  --t:#1a232e;--tm:#4a5568;--ts:#94a3b8;
  --bd:#dde8f0;
  --sh:0 3px 14px rgba(0,0,0,.09);
  --shl:0 8px 32px rgba(0,0,0,.13);
  --shxs:0 1px 4px rgba(0,0,0,.05);
  --r:14px;--rs:8px;
  --nh:68px;--mw:1200px;--tr:.2s ease
}

/* ── Utilities ───────────────────── */
.container{max-width:var(--mw);margin:0 auto;padding:0 24px}
.sg{padding:52px 0}
.sg-sm{padding:36px 0}
.sec-title{font-size:22px;font-weight:800;color:var(--t);margin-bottom:22px}
.badge-blue{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--pl);color:var(--p)}
.badge-green{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--gl);color:var(--gt)}
.badge-red{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#fff0f0;color:#c53030}
.badge-orange{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--orl);color:#c2410c}

/* ── Navigation ──────────────────── */
.nav{position:sticky;top:0;z-index:500;height:var(--nh);background:var(--w);border-bottom:1.5px solid var(--bd);box-shadow:var(--shxs)}
.nav-inner{display:flex;align-items:center;height:100%;max-width:var(--mw);margin:0 auto;padding:0 24px}
.nav-logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;color:var(--t);margin-right:28px;flex-shrink:0}
.nav-links{display:flex;align-items:center;gap:2px;flex:1;overflow:hidden}
.nav-links a{padding:7px 13px;border-radius:24px;font-size:14px;font-weight:500;color:var(--tm);transition:background var(--tr),color var(--tr);white-space:nowrap}
.nav-links a:hover{background:var(--pl);color:var(--p)}
.nav-links a.active{background:var(--p);color:#fff}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.nav-sw{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--bd);border-radius:24px;padding:7px 16px;min-width:200px;transition:border-color var(--tr)}
.nav-sw:focus-within{border-color:var(--p);background:#fff}
.nav-sw input{border:none;background:none;outline:none;font-size:13px;color:var(--t);width:100%}
.nav-sw input::placeholder{color:var(--ts)}
.nav-ib{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tm);transition:background var(--tr),color var(--tr)}
.nav-ib:hover{background:var(--pl);color:var(--p)}
.hamburger{display:none;flex-direction:column;gap:5px;padding:6px;margin-left:auto}
.hamburger span{display:block;height:2px;width:22px;background:var(--t);border-radius:2px;transition:transform .25s ease,opacity .25s ease}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.nav-drawer{position:fixed;top:var(--nh);left:0;right:0;bottom:0;background:var(--w);z-index:490;padding:16px;overflow-y:auto;transform:translateX(-100%);transition:transform .28s ease}
.nav-drawer.open{transform:none}
.nav-drawer a{display:block;padding:14px 16px;font-size:15px;font-weight:500;border-bottom:1px solid var(--bd);color:var(--t);border-radius:var(--rs);transition:background var(--tr)}
.nav-drawer a:hover,.nav-drawer a.active{background:var(--pl);color:var(--p)}
.nd-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--bd);border-radius:24px;padding:10px 16px;margin-bottom:12px}
.nd-search input{border:none;background:none;outline:none;font-size:14px;width:100%}

/* ── Ad Slots ────────────────────── */
.ad-slot{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:var(--rs);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ts);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;gap:4px;position:relative;overflow:hidden}
.ad-lbl{font-size:10px;color:#adb5bd;font-weight:500}
.ad-leader{width:100%;height:90px;margin:16px 0}
.ad-rect{width:100%;height:250px;max-width:336px}
.ad-banner{width:100%;height:90px}
.ad-side{width:100%;height:250px}

/* ── Hero ────────────────────────── */
.hero{background:linear-gradient(130deg,#d6ebf7 0%,#e8f4fd 55%,#f0f8ff 100%);overflow:hidden}
.hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:flex-end;max-width:var(--mw);margin:0 auto;padding:60px 24px 0}
.hero-content{padding-bottom:56px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--pl);color:var(--p);font-size:12px;font-weight:700;letter-spacing:.04em;padding:5px 12px;border-radius:24px;margin-bottom:18px}
.hero-content h1{font-size:clamp(26px,3.5vw,44px);font-weight:800;line-height:1.2;color:var(--t);margin-bottom:32px}
.hero-search{display:flex;align-items:center;background:#fff;border-radius:12px;padding:6px 6px 6px 20px;box-shadow:var(--shl);gap:10px;max-width:520px}
.hero-search input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--t)}
.hero-search input::placeholder{color:var(--ts)}
.hero-search-btn{background:var(--p);color:#fff;border-radius:9px;padding:10px 22px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;transition:background var(--tr);white-space:nowrap;cursor:pointer;border:none;font-family:inherit}
.hero-search-btn:hover{background:var(--ph)}
.hero-img{align-self:flex-end;border-radius:14px 14px 0 0;overflow:hidden}
.hero-img img{width:100%;height:370px;object-fit:cover;object-position:top center}
.hero-img-ph{width:100%;height:370px;background:linear-gradient(135deg,#b3d9f0,#cce5f7);border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--p);font-size:13px;font-weight:600;gap:8px}

/* ── Topics ──────────────────────── */
.topics-sec{background:var(--w);padding:52px 0 44px}
.topics-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.topic-card{border-radius:var(--r);padding:26px 14px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:transform var(--tr),box-shadow var(--tr);text-decoration:none}
.topic-card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.topic-card.tc-blue{background:#e3f4fd}
.topic-card.tc-green{background:#e8f5e9}
.topic-card.tc-purple{background:#f0eaff}
.topic-card.tc-orange{background:#fff4e6}
.topic-icon{width:60px;height:60px;display:flex;align-items:center;justify-content:center}
.topic-name{font-size:13px;font-weight:700;color:var(--t);line-height:1.3}

/* ── Articles ────────────────────── */
.articles-sec{background:var(--w);padding:0 0 52px}
.arts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.art-card{border-radius:var(--r);border:1.5px solid var(--bd);overflow:hidden;background:var(--w);transition:transform var(--tr),box-shadow var(--tr);display:flex;flex-direction:column}
.art-card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.art-card img{width:100%;height:180px;object-fit:cover}
.art-img-ph{width:100%;height:180px;background:linear-gradient(135deg,#b3d9f0,#c8e9c8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
.art-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column}
.art-tag{margin-bottom:10px}
.art-title{font-size:16px;font-weight:700;color:var(--t);line-height:1.4;margin-bottom:8px}
.art-exc{font-size:13px;color:var(--ts);line-height:1.6;margin-bottom:14px;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art-more{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--p);transition:gap var(--tr)}
.art-more:hover{gap:8px}

/* ── Prevention ──────────────────── */
.prev-sec{background:#edf7ed;padding:52px 0}
.prev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.prev-item{display:flex;align-items:center;gap:16px;background:var(--w);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shxs)}
.prev-icon{width:48px;height:48px;flex-shrink:0}
.prev-text{font-size:15px;font-weight:700;color:var(--t)}
.prev-sub{font-size:13px;color:var(--tm);margin-top:2px}

/* ── Footer ──────────────────────── */
.footer{background:var(--w);border-top:1.5px solid var(--bd)}
.ft-top{padding:40px 0 28px}
.ft-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;margin-bottom:28px}
.ft-brand{font-size:17px;font-weight:800;color:var(--t);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.ft-desc{font-size:13px;color:var(--ts);line-height:1.6;max-width:300px}
.ft-col-title{font-size:12px;font-weight:700;color:var(--t);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.ft-links{display:flex;flex-direction:column;gap:10px}
.ft-links a{font-size:13px;color:var(--tm);transition:color var(--tr)}
.ft-links a:hover{color:var(--p)}
.ft-social{display:flex;gap:10px;margin-top:16px}
.soc-btn{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tm);transition:background var(--tr),color var(--tr),border-color var(--tr)}
.soc-btn:hover{background:var(--p);color:#fff;border-color:var(--p)}
.ft-bottom{border-top:1.5px solid var(--bd);padding:18px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.ft-disc{font-size:12px;color:var(--ts);max-width:700px}
.ft-disc strong{color:var(--tm)}
.ft-copy{font-size:12px;color:var(--ts)}

/* ── Breadcrumb ──────────────────── */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ts);margin-bottom:16px;flex-wrap:wrap}
.breadcrumb a{color:var(--p);transition:opacity var(--tr)}
.breadcrumb a:hover{opacity:.7}
.bc-sep{color:var(--bd)}

/* ── Category Page ───────────────── */
.cat-hero{background:linear-gradient(130deg,#d6ebf7,#e8f4fd);padding:44px 0 40px;border-bottom:1.5px solid var(--bd)}
.cat-hero-inner{display:grid;grid-template-columns:1fr 280px;gap:32px;align-items:center}
.cat-hero h1{font-size:32px;font-weight:800;color:var(--t);margin-bottom:10px}
.cat-hero p{font-size:15px;color:var(--tm);max-width:580px;line-height:1.6}
.cat-hero-img{border-radius:var(--r);overflow:hidden}
.cat-hero-img img{width:100%;height:160px;object-fit:cover}
.cat-img-ph{width:100%;height:160px;border-radius:var(--r);background:linear-gradient(135deg,#b3d9f0,#c8e9c8);display:flex;align-items:center;justify-content:center;color:var(--p);font-size:13px;font-weight:600}
.sub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:36px}
.sub-card{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--r);padding:22px 18px;text-align:center;text-decoration:none;transition:transform var(--tr),box-shadow var(--tr);display:flex;flex-direction:column;align-items:center;gap:10px}
.sub-card:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.sub-icon{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sub-icon.blue{background:var(--pl)}
.sub-icon.green{background:var(--gl)}
.sub-icon.purple{background:var(--pul)}
.sub-icon.orange{background:var(--orl)}
.sub-name{font-size:14px;font-weight:700;color:var(--t)}
.sub-desc{font-size:12px;color:var(--ts);line-height:1.4}
.dis-list{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden}
.dis-list-head{padding:16px 22px;border-bottom:1.5px solid var(--bd);font-size:16px;font-weight:800;color:var(--t);display:flex;align-items:center;justify-content:space-between}
.dis-list-count{font-size:13px;font-weight:500;color:var(--ts)}
.dis-item{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--bd);text-decoration:none;transition:background var(--tr)}
.dis-item:last-child{border-bottom:none}
.dis-item:hover{background:var(--pl)}
.dis-ico{width:40px;height:40px;border-radius:var(--rs);background:var(--pl);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dis-ico.green{background:var(--gl)}
.dis-ico.purple{background:var(--pul)}
.dis-ico.orange{background:var(--orl)}
.dis-info h4{font-size:15px;font-weight:600;color:var(--t);margin-bottom:2px}
.dis-info p{font-size:12px;color:var(--ts)}
.dis-arr{margin-left:auto;color:var(--ts)}
.dis-sev{margin-left:auto;margin-right:12px}

/* ── Disease Detail ──────────────── */
.dis-hero{background:linear-gradient(130deg,#d6ebf7,#e8f4fd);padding:40px 0 0;border-bottom:1.5px solid var(--bd)}
.dis-hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:flex-end}
.dis-hero h1{font-size:34px;font-weight:800;color:var(--t);margin-bottom:6px}
.dis-sub{font-size:14px;color:var(--tm);margin-bottom:24px}
.qbar{display:flex;background:var(--w);border-radius:12px 12px 0 0;border:1.5px solid var(--bd);border-bottom:none;overflow:hidden}
.qbar-item{flex:1;padding:14px 10px;text-align:center;border-right:1.5px solid var(--bd)}
.qbar-item:last-child{border-right:none}
.qb-lbl{font-size:10px;color:var(--ts);font-weight:500;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.qb-val{font-size:13px;font-weight:700;color:var(--t);display:flex;align-items:center;justify-content:center;gap:5px}
.qb-val.high{color:#c53030}
.qb-val.medium{color:#c05621}
.qb-val.low{color:var(--gt)}
.qb-val.na{color:var(--ts)}
.dis-hero-img img{width:100%;height:340px;object-fit:cover;border-radius:14px 14px 0 0}
.dis-img-ph{width:100%;height:340px;border-radius:14px 14px 0 0;background:linear-gradient(135deg,#b3d9f0,#c8e9c8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--p);font-size:14px;font-weight:600;gap:8px}
.dis-layout{display:grid;grid-template-columns:1fr 300px;gap:28px;padding:36px 0 52px}
.dis-main{min-width:0}
.dis-side{display:flex;flex-direction:column;gap:20px}
/* Accordion */
.acc{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;user-select:none;transition:background var(--tr)}
.acc-h:hover{background:var(--bg)}
.acc-iw{width:36px;height:36px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-iw.blue{background:var(--pl)}.acc-iw.green{background:var(--gl)}.acc-iw.orange{background:var(--orl)}.acc-iw.purple{background:var(--pul)}.acc-iw.red{background:#fff0f0}
.acc-title{flex:1;font-size:17px;font-weight:700;color:var(--t)}
.acc-chev{color:var(--ts);transition:transform var(--tr)}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-body{padding:0 20px;max-height:0;overflow:hidden;transition:max-height .35s ease,padding .25s ease}
.acc.open .acc-body{padding:4px 20px 22px;max-height:900px}
.acc-body p{font-size:14px;color:var(--tm);line-height:1.7;margin-bottom:12px}
.acc-body ul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.acc-body ul.one{grid-template-columns:1fr}
.acc-body li{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--tm);line-height:1.55}
.acc-body li::before{content:'';width:6px;height:6px;background:var(--p);border-radius:50%;margin-top:7px;flex-shrink:0}
/* Symptom rows */
.sym-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--bg);border-radius:var(--rs);margin-bottom:10px;text-decoration:none;transition:background var(--tr)}
.sym-row:hover{background:var(--pl)}
.sym-ico{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sym-info h4{font-size:14px;font-weight:600;color:var(--t);margin-bottom:1px}
.sym-info p{font-size:12px;color:var(--ts)}
.sym-arr{margin-left:auto;color:var(--ts)}
/* Sidebar widget */
.sw{background:var(--w);border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden}
.sw-head{padding:14px 18px;border-bottom:1.5px solid var(--bd);font-size:14px;font-weight:700;color:var(--t)}
.sw-body{padding:16px 18px}
.sw-link{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px;font-weight:500;color:var(--t);transition:color var(--tr);text-decoration:none}
.sw-link:last-child{border-bottom:none;padding-bottom:0}
.sw-link:hover{color:var(--p)}
.sw-dot{width:8px;height:8px;border-radius:50%;background:var(--pl);border:2px solid var(--p);flex-shrink:0}
/* Buttons */
.btn-p{display:block;width:100%;padding:13px 20px;background:var(--p);color:#fff;border-radius:var(--rs);font-size:15px;font-weight:700;text-align:center;border:none;cursor:pointer;transition:background var(--tr);font-family:inherit;text-decoration:none}
.btn-p:hover{background:var(--ph)}
.btn-o{display:block;width:100%;padding:12px 20px;background:transparent;color:var(--p);border-radius:var(--rs);font-size:15px;font-weight:700;text-align:center;border:1.5px solid var(--p);cursor:pointer;transition:background var(--tr);font-family:inherit;text-decoration:none;margin-top:10px}
.btn-o:hover{background:var(--pl)}

/* ── Responsive ──────────────────── */
@media(max-width:1100px){
  .topics-grid{grid-template-columns:repeat(3,1fr)}
